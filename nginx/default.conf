# Єдина точка входу в систему: http://localhost:8080
# Усе, крім сторінки входу, закрито перевіркою сесії через auth-сервіс.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    # відносні редиректи, інакше nginx підставляє свій порт 80 замість 8080
    absolute_redirect off;

    # внутрішній запит, який робить auth_request
    location = /_verify {
        internal;
        proxy_pass http://auth:8000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login {
        return 302 /auth/login;
    }

    # сторінка входу/виходу доступна без авторизації
    location /auth/ {
        proxy_pass http://auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        auth_request /_verify;
        error_page 401 = @login;
        proxy_pass http://prometheus:9090;
    }

    location / {
        auth_request /_verify;
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_user_role;
        error_page 401 = @login;

        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;

        # websocket для Grafana Live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://grafana:3000;
    }
}
