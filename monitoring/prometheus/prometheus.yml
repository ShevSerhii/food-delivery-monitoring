global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # власні метрики Python-сервісів
  - job_name: generator
    static_configs:
      - targets: ["generator:8000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:8001"]

  - job_name: auth
    static_configs:
      - targets: ["auth:8000"]

  # стан PostgreSQL (з'єднання, транзакції, розмір БД, кеш)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # вбудований плагін rabbitmq_prometheus
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
